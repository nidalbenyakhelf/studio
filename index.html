<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="display" id="display"></div>
      <div class="body" id="body">
        <div class="box control" id="clearAll">c</div>
        <div class="box control" data-con="c">xxx</div>
        <div class="box control" data-con="c">xx</div>
        <div class="box dev" data-con="/">/</div>
        <div class="box" data-con="7">7</div>
        <div class="box" data-con="8">8</div>
        <div class="box" data-con="9">9</div>
        <div class="box" data-con="x">x</div>
        <div class="box" data-con="4">4</div>
        <div class="box" data-con="5">5</div>
        <div class="box" data-con="6">6</div>
        <div class="box" data-con="+">+</div>
        <div class="box" data-con="1">1</div>
        <div class="box" data-con="2">2</div>
        <div class="box" data-con="3">3</div>
        <div class="box" data-con="-">-</div>
        <div class="box" data-con="c">-</div>
        <div class="box" data-con="0">0</div>
        <div class="box" data-con=".">.</div>
        <div class="box equal" id="equal">=</div>
      </div>
    </div>
    <script src="js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
